name: Bug report
description: Report behavior that does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please report security vulnerabilities privately using the link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Somen version
      placeholder: 0.1.0-alpha.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal HTML example when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
