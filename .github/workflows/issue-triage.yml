name: Issue triage

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to triage
        type: string
        required: true

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const { runTriage } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.mjs`);
            await runTriage({ github, context, core }, process.env.ISSUE_NUMBER);
