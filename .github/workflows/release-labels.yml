name: Release note labels

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: release-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    if: github.repository == 'Yusaku01/somen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { labelRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/label-release.mjs`);
            await labelRelease({ github, context, number: context.payload.pull_request.number });
