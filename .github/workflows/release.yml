name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (e.g. v0.1.0-alpha.5)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release intent and main CI
    if: github.repository == 'Yusaku01/somen'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: plan
        with:
          script: |
            const { prepareRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-release.mjs`);
            await prepareRelease({ github, context, core });

  publish:
    name: Publish to npm and GitHub
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PREVIOUS: ${{ needs.prepare.outputs.previous }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.dist_tag }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm code:check
      - run: pnpm test
      - run: pnpm test:automation
      - run: pnpm unused:check
      - run: pnpm docs:check
      - run: pnpm --dir examples/astro-demo build
      - name: Check npm version
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://registry.npmjs.org/somenflow/${process.env.RELEASE_VERSION}`);
          if (response.status !== 404 && !response.ok) throw new Error(`npm registry: ${response.status}`);
          if (response.ok) {
            const published = await response.json();
            if (published.gitHead !== process.env.RELEASE_SHA) throw new Error('Published version belongs to a different commit.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          NODE
      - name: Create or verify release tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const ref = `tags/${process.env.RELEASE_TAG}`;
            let existing;
            try {
              existing = (await github.rest.git.getRef({ ...context.repo, ref })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              const { execFileSync } = await import('node:child_process');
              const sha = execFileSync('git', ['rev-parse', `refs/${ref}^{commit}`], { encoding: 'utf8' }).trim();
              if (sha !== process.env.RELEASE_SHA) throw new Error('Existing tag points to a different commit.');
            } else {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: process.env.RELEASE_SHA });
            }
      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        working-directory: packages/core
        run: npm publish --access public --tag "$RELEASE_CHANNEL"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const args = ['release', 'create', process.env.RELEASE_TAG, '--verify-tag', '--generate-notes', '--notes-start-tag', process.env.RELEASE_PREVIOUS];
          if (process.env.RELEASE_PRERELEASE === 'true') args.push('--prerelease', '--latest=false');
          else args.push('--latest');
          const existing = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/releases`, '--paginate', '--slurp'], { encoding: 'utf8' })).flat();
          const release = existing.find((item) => item.tag_name === process.env.RELEASE_TAG);
          if (release?.draft) throw new Error('A draft release already exists; review it before retrying.');
          if (!release) execFileSync('gh', args, { stdio: 'inherit' });
          NODE
