name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm and GitHub
    if: github.repository == 'Yusaku01/somen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$version" == *-* ]]; then
            dist_tag=${version#*-}
            dist_tag=${dist_tag%%.*}
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            dist_tag=latest
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - run: pnpm code:check
      - run: pnpm test
      - run: pnpm unused:check
      - run: pnpm docs:check
      - run: pnpm --dir examples/astro-demo build
      - name: Check npm version
        id: registry
        shell: bash
        run: |
          if npm view "somenflow@${{ steps.meta.outputs.version }}" version > /dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        working-directory: packages/core
        run: npm publish --access public --tag "${{ steps.meta.outputs.dist_tag }}"
      - name: Create GitHub prerelease
        if: steps.meta.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease
      - name: Create GitHub release
        if: steps.meta.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
